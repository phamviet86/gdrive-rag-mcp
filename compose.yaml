x-app: &app
  build:
    context: .
    args:
      GDRIVE_RAG_EXTRAS: ${GDRIVE_RAG_EXTRAS:-}
  restart: unless-stopped
  environment:
    GDRIVE_FOLDER_ID: ${GDRIVE_FOLDER_ID:?set GDRIVE_FOLDER_ID}
    GDRIVE_SHARED_DRIVE_ID: ${GDRIVE_SHARED_DRIVE_ID:-}
    GDRIVE_RAG_SCOPE_LAYOUT: ${GDRIVE_RAG_SCOPE_LAYOUT:-profile-business-para}
    GDRIVE_RAG_PROFILE_ID: ${GDRIVE_RAG_PROFILE_ID:-default}
    GDRIVE_RAG_ALLOWED_OWNER_PROFILE_IDS: ${GDRIVE_RAG_ALLOWED_OWNER_PROFILE_IDS:-self,shared}
    GDRIVE_RAG_ALLOWED_BUSINESS_FUNCTIONS: ${GDRIVE_RAG_ALLOWED_BUSINESS_FUNCTIONS:-*}
    GDRIVE_RAG_ALLOWED_PARA_CATEGORIES: ${GDRIVE_RAG_ALLOWED_PARA_CATEGORIES:-*}
    GDRIVE_RAG_INDEX_PROFILE: ${GDRIVE_RAG_INDEX_PROFILE:-default}
    GDRIVE_RAG_EMBED_PROVIDER: ${GDRIVE_RAG_EMBED_PROVIDER:-gemini}
    GDRIVE_RAG_EMBED_MODEL: ${GDRIVE_RAG_EMBED_MODEL:-gemini-embedding-001}
    GDRIVE_RAG_EMBED_DIMENSIONS: ${GDRIVE_RAG_EMBED_DIMENSIONS:-768}
    GDRIVE_RAG_EMBED_BASE_URL: ${GDRIVE_RAG_EMBED_BASE_URL:-https://api.openai.com/v1}
    GDRIVE_RAG_EMBED_API_KEY_ENV: ${GDRIVE_RAG_EMBED_API_KEY_ENV:-GEMINI_API_KEY}
    GDRIVE_RAG_EMBED_BATCH_SIZE: ${GDRIVE_RAG_EMBED_BATCH_SIZE:-32}
    GDRIVE_RAG_EMBED_TIMEOUT_SECONDS: ${GDRIVE_RAG_EMBED_TIMEOUT_SECONDS:-60}
    GDRIVE_RAG_EMBED_SEND_DIMENSIONS: ${GDRIVE_RAG_EMBED_SEND_DIMENSIONS:-true}
    GDRIVE_RAG_EMBED_QUERY_INPUT_TYPE: ${GDRIVE_RAG_EMBED_QUERY_INPUT_TYPE:-}
    GDRIVE_RAG_EMBED_DOCUMENT_INPUT_TYPE: ${GDRIVE_RAG_EMBED_DOCUMENT_INPUT_TYPE:-}
    GDRIVE_RAG_EMBED_DEVICE: ${GDRIVE_RAG_EMBED_DEVICE:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    GDRIVE_RAG_BEARER_TOKEN: ${GDRIVE_RAG_BEARER_TOKEN:-}
    GDRIVE_RAG_ACCESS_POLICY_FILE: ${GDRIVE_RAG_ACCESS_POLICY_FILE:-}
    GDRIVE_RAG_TOKEN_ORCHESTRATOR: ${GDRIVE_RAG_TOKEN_ORCHESTRATOR:-}
    GDRIVE_RAG_TOKEN_FINANCE: ${GDRIVE_RAG_TOKEN_FINANCE:-}
    GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
    GDRIVE_RAG_DB_PATH: ${GDRIVE_RAG_DB_PATH:-/data/index.db}
    GDRIVE_RAG_HOST: 0.0.0.0
    GDRIVE_RAG_PORT: 8000
  volumes:
    - index-data:/data
    - ./secrets:/run/secrets:ro

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command:
      - gdrive-rag-mcp
      - sync-loop
      - --interval-seconds
      - ${GDRIVE_RAG_SYNC_INTERVAL_SECONDS:-300}
      - --full-interval-seconds
      - ${GDRIVE_RAG_FULL_SYNC_INTERVAL_SECONDS:-86400}

volumes:
  index-data:
