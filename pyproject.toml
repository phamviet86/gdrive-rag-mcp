[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "google-drive-rag-mcp"
version = "0.5.0"
description = "A local-first Google Drive hybrid retrieval MCP server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "google-drive-rag-mcp contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "google-api-python-client==2.198.0",
  "google-auth-oauthlib==1.4.0",
  "google-genai==1.47.0",
  "httpx==0.28.1",
  "llama-index-core==0.14.16",
  "mcp==2.0.0",
  "openpyxl==3.1.5",
  "pypdf==6.16.1",
  "python-docx==1.2.0",
  "sqlite-vec==0.1.9",
  "typer==0.27.1",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers==6.0.0"]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[project.scripts]
google-drive-rag-mcp = "google_drive_rag_mcp.cli:app"
google-drive-rag-mcp-auth = "google_drive_rag_mcp.cli:auth_google_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/google_drive_rag_mcp"]

[tool.pytest.ini_options]
addopts = "-q --cov=google_drive_rag_mcp --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["google_drive_rag_mcp"]
warn_unused_ignores = true
ignore_missing_imports = true
