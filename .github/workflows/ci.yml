name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/gdrive_rag_mcp
      - run: pytest
      - name: Resolve optional Sentence Transformers extra without installing heavy runtime
        if: matrix.python-version == '3.12'
        run: python -m pip install --dry-run '.[sentence-transformers]'
