name: Feature request
description: Propose a focused improvement to the server, tools, indexing, or documentation.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user need without including real Drive data, IDs, links, or credentials.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the MCP, sync, indexing, storage, or documentation change you expect, including migration or data-flow impact.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: I checked for an existing request covering this use case.
          required: true
        - label: This request is specific to Google Drive RAG MCP and preserves its local-first boundary, or clearly explains why that boundary should change.
          required: true
